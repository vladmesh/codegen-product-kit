[project]
name = "codegen-kit-tooling"
version = "0.1.0"
description = "Generators and validators for codegen-product-kit"
requires-python = ">=3.11"
dependencies = [
    "datamodel-code-generator[http]==0.76.2",
    "jinja2>=3.1",
    "jsonschema>=4.0",
    "packaging>=24.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.scripts]
kit = "framework.cli:main"

[dependency-groups]
dev = [
    "copier>=9.0",
    "fastapi>=0.110.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff==0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["framework"]
