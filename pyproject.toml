[project]
name = "codegen-kit-tooling"
version = "0.1.0"
description = "Generators and validators for codegen-product-kit"
requires-python = ">=3.11"
dependencies = [
    "datamodel-code-generator[http]>=0.25",
    "jinja2>=3.1",
    "jsonschema>=4.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "copier>=9.0",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["framework"]
