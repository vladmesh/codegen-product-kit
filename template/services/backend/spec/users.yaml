domain: users
config:
  rest:
    prefix: "/users"
    tags: ["users"]

operations:
  list_users:
    output: list[UserRead]
    rest:
      method: GET
      path: ""

  grant:
    input: UserGrant
    output: UserAccess
    rest:
      method: POST
      path: "/grant"
      status: 200
    events:
      publish_on_success: user_granted

  resolve:
    output: UserAccess
    params:
      - name: channel
        type: str
        source: query
      - name: external_id
        type: str
        source: query
    rest:
      method: GET
      path: "/access"

  get_user:
    output: UserRead
    params:
      - name: user_id
        type: int
    rest:
      method: GET
      path: "/{user_id}"

  set_user_status:
    input: UserStatusUpdate
    output: UserRead
    params:
      - name: user_id
        type: int
    rest:
      method: PATCH
      path: "/{user_id}/status"

  delete_user:
    params:
      - name: user_id
        type: int
    rest:
      method: DELETE
      path: "/{user_id}"
      status: 204
