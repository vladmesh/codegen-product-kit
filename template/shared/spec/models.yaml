models:
  User:
    fields:
      id:
        type: int
        readonly: true
      telegram_id:
        type: int
        ge: 0
      is_admin:
        type: bool
        default: false
      created_at:
        type: datetime
        readonly: true
      updated_at:
        type: datetime
        readonly: true
    variants:
      # is_admin is never accepted from the API: the backend is reachable from
      # outside the stack, so an input variant carrying it would let anyone grant
      # themselves the flag. It stays readable and is set out of band.
      Create:
        exclude: [is_admin]
      Update:
        exclude: [is_admin]
        optional: [telegram_id]
      Read: {}

  CommandReceived:
    fields:
      command:
        type: string
      args:
        type: list[string]
      user_id:
        type: int
      timestamp:
        type: datetime
    variants:
      Create:
        optional: [timestamp]
