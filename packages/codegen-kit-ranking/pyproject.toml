[project]
name = "codegen-kit-ranking"
version = "0.1.0"
description = "Deterministic ranking of publications and of the caller's tg-channels posts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0,<2.0.0",
    "fastapi>=0.110.0,<1.0.0",
    "pydantic>=2.5",
    "sqlalchemy>=2.0.0,<3.0.0",
]

[project.entry-points."codegen_kit.packages"]
ranking = "codegen_kit_ranking:package"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codegen_kit_ranking"]

[tool.hatch.build.targets.wheel.force-include]
"codegen_kit_ranking/package.yaml" = "codegen_kit_ranking/package.yaml"
"codegen_kit_ranking/bindings/default.yaml" = "codegen_kit_ranking/bindings/default.yaml"
