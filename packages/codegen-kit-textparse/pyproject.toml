[project]
name = "codegen-kit-textparse"
version = "0.1.0"
description = "Deterministic three-form English reminder times"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = ["tzdata>=2024.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codegen_kit_textparse"]
