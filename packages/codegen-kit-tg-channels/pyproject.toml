[project]
name = "codegen-kit-tg-channels"
version = "0.1.0"
description = "Public Telegram channel lists, digests and timed post delivery"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0,<2.0.0",
    "fastapi>=0.110.0,<1.0.0",
    "faststream[redis]>=0.5.0",
    "httpx>=0.27.0,<1.0.0",
    "pydantic>=2.5",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
]

[project.entry-points."codegen_kit.packages"]
tg-channels = "codegen_kit_tg_channels:package"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codegen_kit_tg_channels"]

[tool.hatch.build.targets.wheel.force-include]
"codegen_kit_tg_channels/package.yaml" = "codegen_kit_tg_channels/package.yaml"
"codegen_kit_tg_channels/bindings/default.yaml" = "codegen_kit_tg_channels/bindings/default.yaml"
"codegen_kit_tg_channels/contracts/openapi.json" = "codegen_kit_tg_channels/contracts/openapi.json"
