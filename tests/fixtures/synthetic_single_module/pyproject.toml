[project]
name = "codegen-kit-synthetic-single-module"
version = "1.0.0"
requires-python = ">=3.11"

[project.entry-points."codegen_kit.packages"]
single-module = "single_module:package"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["single_module.py", "package.yaml"]
