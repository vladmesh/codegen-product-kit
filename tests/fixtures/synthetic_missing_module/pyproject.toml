[project]
name = "codegen-kit-synthetic-missing-module"
version = "1.0.0"
requires-python = ">=3.11"

[project.entry-points."codegen_kit.packages"]
missing-module = "missing_module:package"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["payload.py", "package.yaml"]
