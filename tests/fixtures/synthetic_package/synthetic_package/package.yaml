protocol_version: 1
name: synthetic
version: 1.2.4
requires_core: ">=1,<2"
provides: [synthetic.status]
requires: []
package_dependencies: [alembic, fastapi, sqlalchemy]
http:
  prefix: /synthetic
database:
  schema: synthetic
  migrations: synthetic_package:migrations
events:
  publishes: [synthetic.ready, synthetic.requested]
  consumes: [synthetic.requested]
  messages:
    synthetic.ready:
      model: SyntheticReady
      schema:
        type: object
        properties:
          package_id: {type: string}
        required: [package_id]
        additionalProperties: false
    synthetic.requested:
      model: SyntheticRequested
      schema:
        type: object
        properties:
          request_id: {type: string}
        required: [request_id]
        additionalProperties: false
settings_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    enabled: {type: boolean}
  additionalProperties: false
jobs_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    refresh:
      type: object
      properties:
        force: {type: boolean}
      additionalProperties: false
  additionalProperties: false
environment:
  - name: SYNTHETIC_TOKEN
    required: true
resources:
  - name: sample
    path: synthetic_package/data/sample.txt
