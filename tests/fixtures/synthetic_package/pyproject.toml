[project]
name = "codegen-kit-synthetic-package"
version = "1.2.4"
requires-python = ">=3.11"

[project.entry-points."codegen_kit.packages"]
synthetic = "synthetic_package:package"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["synthetic_package"]

[tool.hatch.build.targets.wheel.force-include]
"synthetic_package/package.yaml" = "synthetic_package/package.yaml"
