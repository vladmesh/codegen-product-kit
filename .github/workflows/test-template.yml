name: Test Copier Template

on:
  push:
    branches:
      - main
    paths:
      - 'copier.yml'
      - 'framework/**'
      - 'packages/**'
      - 'pyproject.toml'
      - 'template/**'
      - 'tests/copier/**'
      - '.github/workflows/test-template.yml'
  pull_request:
    # No path filter: this is a required status check on main, so it must run on
    # every PR. A path-filtered required check that never triggers blocks merges.
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: "1"

jobs:
  test-generation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Docker Hub pulls go through the credential-free public mirror (mirror.gcr.io) before
      # this job creates any container; the image references themselves stay unchanged and the
      # daemon falls back to Docker Hub for an image the mirror lacks. Other daemon.json keys are
      # kept. Builds use the daemon's own BuildKit (the docker driver), which shares the mirror.
      - name: Pull Docker Hub images through the public mirror
        env:
          REGISTRY_MIRROR: https://mirror.gcr.io
        run: |
          sudo python3 - "$REGISTRY_MIRROR" <<'EOF'
          import json, pathlib, sys
          path = pathlib.Path("/etc/docker/daemon.json")
          text = path.read_text() if path.exists() else ""
          config = json.loads(text) if text.strip() else {}
          mirrors = [item for item in config.get("registry-mirrors", []) if item != sys.argv[1]]
          config["registry-mirrors"] = [sys.argv[1], *mirrors]
          path.write_text(json.dumps(config, indent=2) + "\n")
          EOF
          sudo cat /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{json .RegistryConfig.Mirrors}}' | tee "$RUNNER_TEMP/mirrors.json"
          grep -F mirror.gcr.io "$RUNNER_TEMP/mirrors.json"
          docker buildx inspect | tee "$RUNNER_TEMP/builder.txt"
          grep -Eq '^Driver: +docker$' "$RUNNER_TEMP/builder.txt"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@6ee6290f1cbc4156c0bdd66691b2c144ef8df19a
        with:
          version: "0.11.29"
          checksum: "04f8b82f5d47f0512dcd32c67a4a6f16a0ea27c81537c338fd0ad6b23cebe829"

      - name: Install copier and dependencies
        run: pip install copier pyyaml ruff

      - name: Generate project
        env:
          TOOLING_REPOSITORY: ${{ github.event.pull_request.head.repo.clone_url || format('{0}/{1}.git', github.server_url, github.repository) }}
          TOOLING_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          copier copy . /tmp/test-project \
            --data project_name=test-project \
            --data modules=backend \
            --data tooling_requirement="codegen-kit-tooling @ git+${TOOLING_REPOSITORY}@${TOOLING_SHA}" \
            --defaults --trust --vcs-ref="${{ github.sha }}"

      - name: Verify generated backend project
        run: |
          cd /tmp/test-project
          git init
          git config user.name "Template CI"
          git config user.email "template-ci@example.com"
          git add -A
          git commit -m "Generated baseline"
          make setup
          make generate-from-spec
          make validate-specs
          make lint
          make typecheck
          make tests
          test -z "$(git status --porcelain)"

      - name: Run generated durable-event integration stack
        run: |
          cd /tmp/test-project
          cp .env.example .env
          make test-integration

      - name: Clean up generated integration stack
        if: always()
        run: |
          cd /tmp/test-project
          COMPOSE_PROJECT_NAME=tests-integration docker compose \
            -f infra/compose.tests.integration.yml down --volumes --remove-orphans || true

      - name: Smoke generated pre-commit hook
        run: |
          cd /tmp/test-project
          printf 'value=1\n' > pre_commit_smoke.py
          git add pre_commit_smoke.py
          git commit -m "Smoke generated pre-commit hook"
          test "$(cat pre_commit_smoke.py)" = "value = 1"

  test-pytest:
    runs-on: ubuntu-latest
    env:
      CODEGEN_TOOLING_REQUIREMENT: "codegen-kit-tooling @ git+${{ github.event.pull_request.head.repo.clone_url || format('{0}/{1}.git', github.server_url, github.repository) }}@${{ github.event.pull_request.head.sha || github.sha }}"
      CODEGEN_CORE_UPGRADE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Docker Hub pulls go through the credential-free public mirror (mirror.gcr.io) before
      # this job creates any container; the image references themselves stay unchanged and the
      # daemon falls back to Docker Hub for an image the mirror lacks. Other daemon.json keys are
      # kept. Builds use the daemon's own BuildKit (the docker driver), which shares the mirror.
      - name: Pull Docker Hub images through the public mirror
        env:
          REGISTRY_MIRROR: https://mirror.gcr.io
        run: |
          sudo python3 - "$REGISTRY_MIRROR" <<'EOF'
          import json, pathlib, sys
          path = pathlib.Path("/etc/docker/daemon.json")
          text = path.read_text() if path.exists() else ""
          config = json.loads(text) if text.strip() else {}
          mirrors = [item for item in config.get("registry-mirrors", []) if item != sys.argv[1]]
          config["registry-mirrors"] = [sys.argv[1], *mirrors]
          path.write_text(json.dumps(config, indent=2) + "\n")
          EOF
          sudo cat /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{json .RegistryConfig.Mirrors}}' | tee "$RUNNER_TEMP/mirrors.json"
          grep -F mirror.gcr.io "$RUNNER_TEMP/mirrors.json"
          docker buildx inspect | tee "$RUNNER_TEMP/builder.txt"
          grep -Eq '^Driver: +docker$' "$RUNNER_TEMP/builder.txt"

      # The binding Redis the slow copier tests use (CODEGEN_BINDINGS_REDIS_URL, database 14).
      # An Actions service container would be pulled before any step, past the mirror, so this
      # job starts it itself after the mirror is configured and removes only this container.
      - name: Start the binding Redis
        run: |
          docker run --detach --name codegen-binding-redis --publish 6379:6379 \
            --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s \
            --health-retries 10 redis:7-alpine
          for _ in $(seq 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' codegen-binding-redis)
            if [ "$status" = healthy ]; then break; fi
            sleep 1
          done
          test "$status" = healthy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@6ee6290f1cbc4156c0bdd66691b2c144ef8df19a
        with:
          version: "0.11.29"
          checksum: "04f8b82f5d47f0512dcd32c67a4a6f16a0ea27c81537c338fd0ad6b23cebe829"

      - name: Install dependencies
        run: make setup

      - name: Run copier tests (fast)
        run: make test-copier

      - name: Run copier tests (slow)
        env:
          CODEGEN_RELEASE_SMOKE_RECEIPT: ${{ runner.temp }}/textparse-remote-receipt.json
          CODEGEN_BINDINGS_SMOKE_RECEIPT: ${{ runner.temp }}/bindings-remote-receipt.json
          CODEGEN_BINDINGS_REDIS_URL: redis://127.0.0.1:6379/14
          CODEGEN_CORE_UPGRADE_RECEIPT: ${{ runner.temp }}/core-21-upgrade-receipt.json
          CODEGEN_BOUND_INTEGRATION_LOG_DIR: ${{ runner.temp }}/bound-product-integration
        run: make test-copier-slow

      - name: Preserve bound product integration output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bound-product-integration-${{ github.run_id }}
          path: ${{ runner.temp }}/bound-product-integration
          if-no-files-found: error

      - name: Preserve published textparse release-smoke receipt
        uses: actions/upload-artifact@v4
        with:
          name: textparse-remote-release-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/textparse-remote-receipt.json
          if-no-files-found: error

      - name: Preserve published bindings and real Redis receipt
        uses: actions/upload-artifact@v4
        with:
          name: bindings-remote-redis-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/bindings-remote-receipt.json
          if-no-files-found: error

      - name: Preserve released core 2.1 upgrade receipt
        uses: actions/upload-artifact@v4
        with:
          name: core-21-upgrade-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/core-21-upgrade-receipt.json
          if-no-files-found: error

      - name: Remove the binding Redis
        if: always()
        run: docker rm --force --volumes codegen-binding-redis || true
