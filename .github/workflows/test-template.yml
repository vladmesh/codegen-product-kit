name: Test Copier Template

on:
  push:
    branches:
      - main
    paths:
      - 'copier.yml'
      - 'template/**'
      - 'tests/copier/**'
      - '.github/workflows/test-template.yml'
  pull_request:
    # No path filter: this is a required status check on main, so it must run on
    # every PR. A path-filtered required check that never triggers blocks merges.
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: "1"

jobs:
  test-generation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.29"

      - name: Install copier and dependencies
        run: pip install copier pyyaml ruff

      - name: Generate project
        run: |
          copier copy . /tmp/test-project \
            --data project_name=test-project \
            --data modules=backend \
            --defaults --trust --vcs-ref="${{ github.sha }}"

      - name: Typecheck generated backend project
        run: |
          cd /tmp/test-project
          git init
          git config user.name "Template CI"
          git config user.email "template-ci@example.com"
          make setup && make typecheck

      - name: Smoke generated pre-commit hook
        run: |
          cd /tmp/test-project
          printf 'value=1\n' > pre_commit_smoke.py
          git add pre_commit_smoke.py
          git commit -m "Smoke generated pre-commit hook"
          test "$(cat pre_commit_smoke.py)" = "value = 1"

  test-pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.29"

      - name: Install dependencies
        run: make setup

      - name: Run copier tests (fast)
        run: make test-copier

      - name: Run copier tests (slow)
        run: make test-copier-slow
