name: Framework CI

on:
  push:
    branches:
      - main
    paths:
      - 'framework/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/ci.yml'
      - 'Makefile'
      - '.coveragerc'
      - '.gitignore'
  pull_request:
    # No path filter: this is a required status check on main, so it must run on
    # every PR. A path-filtered required check that never triggers blocks merges.
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: "1"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@6ee6290f1cbc4156c0bdd66691b2c144ef8df19a
        with:
          version: "0.11.29"
          checksum: "04f8b82f5d47f0512dcd32c67a4a6f16a0ea27c81537c338fd0ad6b23cebe829"

      - name: Install framework dependencies
        run: make setup

      - name: Check framework sync
        run: make check-sync

      - name: Run linters
        run: |
          make lint
          make lint-template

      - name: Run unit tests
        run: make test
