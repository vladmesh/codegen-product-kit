name: Runner Proof

# A fresh backend,tg_bot product from the exact kit candidate, installed with tg-channels by the
# orchestrator's real executor, through its own CI, its main image path and a post delivered via
# the pinned platform's real auth and Caddy; a second leg installs the published reminders first
# and proves both modules side by side. See docs/RUNNER_PROOF.md for the proof and catalog
# modes, the evidence contract and for running the same proof from another repository.

on:
  push:
    branches:
      - main
  pull_request:
    # No path filter: the proof is required for every PR and for main. A path-filtered or
    # skipped required check would read as green without having run.
    branches:
      - main
  workflow_call:
    inputs:
      kit_sha:
        description: Kit candidate commit reachable on vladmesh/codegen-product-kit
        type: string
        required: true
      orchestrator_sha:
        description: Orchestrator commit (empty for the kit's pin)
        type: string
        required: false
        default: ""
      platform_sha:
        description: Platform services commit (empty for the kit's pin)
        type: string
        required: false
        default: ""
      proof_mode:
        description: >-
          published_release (the pinned published tg-channels tag, read from the real remote)
          or candidate_release (a pending release of the kit through the isolated fixture)
        type: string
        required: true
      catalog_mode:
        description: >-
          remote_head (the real default branch's catalog, no fixture) or candidate_snapshot
          (the kit candidate's committed catalog as an isolated prospective HEAD) for
          published_release; pending_fixture for candidate_release; never a fallback
        type: string
        required: true
      package_version:
        description: Expected tg-channels version the planner must select
        type: string
        required: true
    secrets:
      PLATFORM_SERVICES_DEPLOY_KEY:
        description: Read-only deploy key of vladmesh/codegen-platform-services
        required: true

permissions:
  contents: read

env:
  DOCKER_BUILDKIT: "1"

jobs:
  fresh-product-runner:
    name: Fresh product runner proof (${{ matrix.leg }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # The release matrix: (a) a fresh product with tg-channels alone, (b) the published
      # reminders installed first, then tg-channels. Both run the full product CI, main image,
      # registry, platform and delivery path.
      matrix:
        include:
          - leg: fresh
            packages: tg-channels
          - leg: coexistence
            packages: reminders,tg-channels
    env:
      KIT_SHA: ${{ inputs.kit_sha || github.event.pull_request.head.sha || github.sha }}
      # Pins of this proof; a caller passes other exact SHAs as inputs.
      ORCHESTRATOR_SHA: ${{ inputs.orchestrator_sha || 'ec96fa79c84937982420f0f01388d90000bd69eb' }}
      PLATFORM_SHA: ${{ inputs.platform_sha || '070dfb359f9a121546d1362ae84c9d0856cabf64' }}
      # This repository's own runs prove the published tg-channels 0.1.2: a pull request against
      # the catalog it would publish (candidate_snapshot, prospective), main against the real
      # default branch's catalog (remote_head). A caller names all three explicitly.
      CALLED: ${{ inputs.kit_sha != '' }}
      PROOF_MODE: ${{ inputs.proof_mode || 'published_release' }}
      CATALOG_MODE: >-
        ${{ inputs.catalog_mode
        || (github.event_name == 'pull_request' && 'candidate_snapshot')
        || 'remote_head' }}
      PACKAGE_VERSION: ${{ inputs.package_version || '0.1.2' }}
      PACKAGES: ${{ matrix.packages }}
    steps:
      # The deploy key is used only for a push to main and a same-repository pull request, also
      # when another repository calls this workflow; anything else fails instead of skipping.
      - name: Require a trusted source and the platform deploy key
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          HAS_PLATFORM_KEY: ${{ secrets.PLATFORM_SERVICES_DEPLOY_KEY != '' }}
        run: |
          if [ "$EVENT" = pull_request ] && [ "$HEAD_REPOSITORY" = "$REPOSITORY" ]; then
            :
          elif [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            :
          else
            echo "The runner proof runs only for main pushes and same-repository pull requests" \
              "($EVENT $REF $HEAD_REPOSITORY); this required check fails." >&2
            exit 1
          fi
          if [ "$HAS_PLATFORM_KEY" != true ]; then
            echo "PLATFORM_SERVICES_DEPLOY_KEY is unavailable; the runner proof cannot pass." >&2
            exit 1
          fi
          for sha in "$KIT_SHA" "$ORCHESTRATOR_SHA" "$PLATFORM_SHA"; do
            if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Not a full commit SHA: $sha" >&2
              exit 1
            fi
          done
          case "$PROOF_MODE/$CATALOG_MODE" in
            published_release/remote_head|published_release/candidate_snapshot) ;;
            candidate_release/pending_fixture) ;;
            *) echo "Unknown proof/catalog mode: $PROOF_MODE/$CATALOG_MODE" >&2; exit 1 ;;
          esac
          # Own runs: a pull request proves the prospective catalog snapshot, only main proves
          # the real default branch; neither can be the other or the pending fixture.
          if [ "$CALLED" != true ]; then
            expected=remote_head
            if [ "$EVENT" = pull_request ]; then expected=candidate_snapshot; fi
            if [ "$PROOF_MODE" != published_release ] || [ "$CATALOG_MODE" != "$expected" ]; then
              echo "$EVENT must prove published_release/$expected," \
                "not $PROOF_MODE/$CATALOG_MODE" >&2
              exit 1
            fi
          fi

      - name: Refuse URL rewrites around the deploy key
        run: |
          for scope in --system --global; do
            if git config "$scope" --get-regexp '^url\..*\.insteadof$'; then
              echo "A $scope insteadOf rewrite could replace the SSH deploy key" >&2
              exit 1
            fi
          done

      - name: Free runner disk for product, platform and registry images
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      # Docker Hub pulls go through the credential-free public mirror (mirror.gcr.io) before
      # this job creates any container; the image references themselves stay unchanged and the
      # daemon falls back to Docker Hub for an image the mirror lacks. Other daemon.json keys are
      # kept. Builds use the daemon's own BuildKit (the docker driver), which shares the mirror.
      - name: Pull Docker Hub images through the public mirror
        env:
          REGISTRY_MIRROR: https://mirror.gcr.io
        run: |
          sudo python3 - "$REGISTRY_MIRROR" <<'EOF'
          import json, pathlib, sys
          path = pathlib.Path("/etc/docker/daemon.json")
          text = path.read_text() if path.exists() else ""
          config = json.loads(text) if text.strip() else {}
          mirrors = [item for item in config.get("registry-mirrors", []) if item != sys.argv[1]]
          config["registry-mirrors"] = [sys.argv[1], *mirrors]
          path.write_text(json.dumps(config, indent=2) + "\n")
          EOF
          sudo cat /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{json .RegistryConfig.Mirrors}}' | tee "$RUNNER_TEMP/mirrors.json"
          grep -F mirror.gcr.io "$RUNNER_TEMP/mirrors.json"
          docker buildx inspect | tee "$RUNNER_TEMP/builder.txt"
          grep -Eq '^Driver: +docker$' "$RUNNER_TEMP/builder.txt"

      - name: Check out the kit candidate
        uses: actions/checkout@v4
        with:
          repository: vladmesh/codegen-product-kit
          ref: ${{ env.KIT_SHA }}
          path: kit
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the pinned orchestrator
        uses: actions/checkout@v4
        with:
          repository: vladmesh/codegen_orchestrator
          ref: ${{ env.ORCHESTRATOR_SHA }}
          path: orchestrator
          persist-credentials: false

      - name: Check out the pinned platform with the read-only deploy key
        uses: actions/checkout@v4
        with:
          repository: vladmesh/codegen-platform-services
          ref: ${{ env.PLATFORM_SHA }}
          path: platform
          ssh-key: ${{ secrets.PLATFORM_SERVICES_DEPLOY_KEY }}
          persist-credentials: false

      - name: Verify fetched heads and the platform transport
        run: |
          test "$(git -C kit rev-parse HEAD)" = "$KIT_SHA"
          test "$(git -C orchestrator rev-parse HEAD)" = "$ORCHESTRATOR_SHA"
          test "$(git -C platform rev-parse HEAD)" = "$PLATFORM_SHA"
          origin=$(git -C platform remote get-url origin)
          case "$origin" in
            git@github.com:vladmesh/codegen-platform-services*) ;;
            *) echo "Platform was not fetched over the SSH deploy key: $origin" >&2; exit 1 ;;
          esac
          if git -C platform config --get-regexp '^(http\..*extraheader|core\.sshcommand)$'; then
            echo "Platform checkout kept credentials" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@6ee6290f1cbc4156c0bdd66691b2c144ef8df19a
        with:
          version: "0.11.29"
          checksum: "04f8b82f5d47f0512dcd32c67a4a6f16a0ea27c81537c338fd0ad6b23cebe829"

      - name: Prepare the orchestrator environment with the candidate tooling
        working-directory: orchestrator
        run: |
          uv sync --frozen
          uv pip install --python .venv/bin/python --reinstall-package codegen-kit-tooling \
            "codegen-kit-tooling @ git+https://github.com/vladmesh/codegen-product-kit.git@${KIT_SHA}"

      - name: Run the fresh product runner proof
        run: |
          orchestrator/.venv/bin/python kit/tests/runner/fresh_product.py \
            --kit-dir kit --kit-sha "$KIT_SHA" \
            --orchestrator-dir orchestrator --orchestrator-sha "$ORCHESTRATOR_SHA" \
            --platform-dir platform --platform-sha "$PLATFORM_SHA" \
            --proof-mode "$PROOF_MODE" --catalog-mode "$CATALOG_MODE" \
            --package-version "$PACKAGE_VERSION" \
            --packages "$PACKAGES" --output-dir "$RUNNER_TEMP/runner-proof"

      - name: Preserve runner proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-proof-${{ matrix.leg }}-${{ env.KIT_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runner-proof
          if-no-files-found: error

      - name: Require passed SHA-bound evidence
        run: |
          python3 - "$RUNNER_TEMP/runner-proof/runner-proof.json" <<'EOF'
          import json, os, re, sys
          sys.path.insert(0, "kit/tests/runner")
          import support
          evidence = json.load(open(sys.argv[1]))
          pinned = {
              "kit": os.environ["KIT_SHA"],
              "orchestrator": os.environ["ORCHESTRATOR_SHA"],
              "platform": os.environ["PLATFORM_SHA"],
          }
          mode, version = os.environ["PROOF_MODE"], os.environ["PACKAGE_VERSION"]
          catalog_mode = os.environ["CATALOG_MODE"]
          packages = os.environ["PACKAGES"].split(",")
          assert evidence["status"] == "passed", evidence.get("error")
          assert evidence["pinned"] == pinned, evidence["pinned"]
          assert evidence["revisions"]["product_tooling"]["vcs_info"]["commit_id"] == pinned["kit"]
          assert evidence["template"]["resolved_sha"] == pinned["kit"]
          for key in ("install", "release", "coexistence", "product_ci", "cold_main_regression",
                      "main_images", "integration_without_host_environments", "platform",
                      "deployment", "scenario", "catalog"):
              assert evidence.get(key), f"missing evidence section {key}"
          release, catalog = evidence["release"], evidence["catalog"]
          assert evidence["proof_mode"] == release["mode"] == mode, (evidence["proof_mode"], mode)
          assert evidence["catalog_mode"] == catalog["mode"] == catalog_mode, catalog
          # Planner, HTTP reads and both probes reached the one catalog the run recorded.
          assert set(catalog["planner_digests"].values()) == {catalog["catalog_digest"]}, catalog
          assert release["planner_catalog_digest"] == catalog["catalog_digest"], catalog
          assert all(item == {"preflight_returncode": 0, "readback": True}
                     for item in catalog["probe_agreement"].values()), catalog
          assert evidence["matrix"]["packages"] == packages, evidence["matrix"]
          assert sorted(evidence["installs"]) == sorted(packages), sorted(evidence["installs"])
          assert evidence["module"]["version"] == release["version"] == version, release
          assert release["probe_source"]["target"] == release["tag_target"]
          if mode == "candidate_release":
              # The exact candidate through the fixture; its intended tag is not published.
              assert release["published"] is False and release["published_catalog_lists_version"] is False
              assert release["source_sha"] == release["tag_target"] == pinned["kit"], release
              assert release["tag_type"] == "tag" and release["wheels"], release
          else:
              # The pinned published tag, read from the real remote before planning; the probe
              # fetched exactly it, and no tag was created anywhere.
              pin = support.published_release("tg-channels", version)
              assert release["published"] is True and "intended_tag" not in release, release
              assert release["published_tag"] == {
                  "tag": pin.tag, "type": "tag", "tag_object": pin.tag_object,
                  "target": pin.target, "tree": pin.tree}, release
              source = release["probe_source"]
              assert (source["tag"], source["tag_object"], source["target"], source["tree"]) == (
                  pin.tag, pin.tag_object, pin.target, pin.tree), source
              assert release["remote_package_tags"][pin.tag] == pin.tag_object
              assert release["installed_distribution"]["version"] == version, release
          if catalog_mode == "candidate_snapshot":
              # Prospective: the candidate's own committed catalog, not the real default branch.
              assert catalog["prospective"] is True and catalog["commit"] == pinned["kit"], catalog
              assert any(item["path"].endswith("/HEAD/packages/catalog.yaml")
                         for item in catalog["http_requests"]), catalog
          elif catalog_mode == "remote_head":
              # The real default branch, fetched by this run before planning and after install.
              assert catalog["prospective"] is False and "http_requests" not in catalog, catalog
              assert re.fullmatch(r"[0-9a-f]{40}", catalog["commit"]), catalog
              assert catalog["after_install"]["catalog_digest"] == catalog["catalog_digest"]
          scenario = evidence["scenario"]
          assert scenario["delivered_post"]["text"] and scenario["delivered_post"]["chat_id"]
          # Grant, revoke, grant again: each 200 is what the next ordinary access read returns.
          cycle = scenario["access_acknowledgments"]["steps"]
          assert [(step["operation"], step["expected"]) for step in cycle] == [
              ("grant", "active"), ("revoke", "inactive"), ("grant", "active")], cycle
          for step in cycle:
              assert step["write"]["status"] == step["access"]["status"] == 200, step
              assert step["write"]["body"]["status"] == step["expected"], step
              assert step["access"]["body"] == step["write"]["body"], step
          if "reminders" in packages:
              assert scenario["reminders"]["delivered"]["text"].startswith("Reminder: ")
          # RU/EN: stored and read back first, then six probes, each in its own chat with its
          # native update id and its first reply there, checked without problems.
          languages = scenario["languages"]
          assert not languages["ledger"]["duplicates"] and not languages["ledger"]["unmatched"]
          for locale in support.LANGUAGES:
              phase = languages[locale]
              assert phase["readback"]["body"]["value"] == locale, phase["readback"]
              assert [probe["kind"] for probe in phase["probes"].values()] == [
                  kind for kind, _ in support.LANGUAGE_PROBES]
              for kind, probe in phase["probes"].items():
                  assert probe["chat_id"] == support.probe_chat(locale, kind), probe
                  assert probe["reply"]["chat_id"] == probe["chat_id"], probe
                  assert probe["reply"]["seq"] > probe["watermark"], probe
                  assert isinstance(probe["update_id"], int) and probe["problems"] == [], probe
          print(json.dumps({"mode": mode, "catalog_mode": catalog_mode, "packages": packages,
                            "catalog_commit": catalog["commit"],
                            "delivered_post": scenario["delivered_post"]}, indent=2))
          EOF
